<!doctype html>
<!-- The README's hero image (hero.jpg), drawn as a stylised Stream Multiview in the Pear theme: no real
     streams, chats or usernames. To regenerate hero.jpg after editing (needs npm run test:setup once):
     node -e "require('playwright').chromium.launch().then(async b=>{const p=await b.newPage({viewport:{width:1280,height:640},deviceScaleFactor:2});await p.goto('file://'+require('path').resolve('.github/assets/hero.html'));await p.screenshot({path:'.github/assets/hero.jpg',type:'jpeg',quality:90});await b.close()})" -->
<html><head><meta charset="utf-8">
<style>
  :root{--bg:#0a0c0d;--panel:#131719;--panel2:#1b2023;--line:#283034;--line2:#353e43;--text:#e7ede9;--muted:#87928c;--accent:#53fc18;
        --kick:#53fc18;--twitch:#a970ff;--yt:#ff3d3d}
  *{box-sizing:border-box;margin:0}
  html,body{width:1280px;height:640px;overflow:hidden}
  body{background:radial-gradient(1200px 600px at 85% -10%,rgba(83,252,24,.16),transparent 60%),
       radial-gradient(900px 500px at -10% 110%,rgba(169,112,255,.14),transparent 60%),var(--bg);
       font-family:-apple-system,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;color:var(--text);position:relative}

  /* left: name and tagline */
  .intro{position:absolute;left:72px;top:0;bottom:0;width:430px;display:flex;flex-direction:column;justify-content:center;gap:22px}
  .logo{display:flex;align-items:center;gap:14px}
  .logo svg{width:58px;height:58px;filter:drop-shadow(0 0 18px rgba(83,252,24,.45))}
  .logo svg .body{fill:var(--accent)}
  .logo svg .stem{fill:none;stroke:var(--accent);stroke-width:3.2;stroke-linecap:round}
  h1{font-size:54px;line-height:1.02;letter-spacing:-.02em;font-weight:800}
  h1 span{color:var(--accent)}
  .tag{font-size:21px;line-height:1.45;color:#b9c4be}
  .chips{display:flex;gap:10px;flex-wrap:wrap}
  .chip{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;background:var(--panel);border:1px solid var(--line2);font-size:15px;font-weight:600}
  .chip i{width:10px;height:10px;border-radius:50%}

  /* right: the app window */
  .app{position:absolute;left:560px;top:58px;width:800px;height:540px;border-radius:16px;background:var(--panel);
       border:1px solid var(--line2);box-shadow:0 40px 90px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.03) inset;overflow:hidden;
       transform:perspective(1600px) rotateY(-9deg) rotateX(3deg);transform-origin:left center}
  .bar{height:44px;display:flex;align-items:center;gap:8px;padding:0 14px;border-bottom:1px solid var(--line);background:var(--panel2)}
  .dots{display:flex;gap:7px;margin-right:6px}.dots i{width:11px;height:11px;border-radius:50%;background:#3a4246}
  .dots i:nth-child(1){background:#ff5f57}.dots i:nth-child(2){background:#febc2e}.dots i:nth-child(3){background:#28c840}
  .field{height:26px;width:190px;border-radius:7px;background:var(--bg);border:1px solid var(--line2)}
  .btn{height:26px;padding:0 12px;border-radius:7px;background:var(--panel);border:1px solid var(--line2);font-size:12px;display:flex;align-items:center;color:var(--muted)}
  .btn.add{background:var(--accent);color:#0a0c0d;font-weight:700;border-color:var(--accent)}
  .grid{position:absolute;top:44px;left:0;right:0;bottom:0;padding:10px;display:grid;grid-template-columns:1.9fr 1fr 1fr;grid-template-rows:1fr 1fr;gap:10px}
  .win{border-radius:10px;background:var(--bg);border:1px solid var(--line2);overflow:hidden;display:flex;flex-direction:column}
  .win.big{grid-row:span 2;border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 0 28px rgba(83,252,24,.25)}
  .tb{height:26px;display:flex;align-items:center;gap:7px;padding:0 9px;font-size:11px;font-weight:600;color:var(--text);background:var(--panel2);flex:none}
  .tb i{width:8px;height:8px;border-radius:50%}
  .tb .vol{margin-left:auto;width:46px;height:4px;border-radius:2px;background:var(--line2);position:relative}
  .tb .vol::after{content:"";position:absolute;left:0;top:0;bottom:0;width:65%;border-radius:2px;background:var(--accent)}
  .video{flex:1;position:relative;overflow:hidden}
  .v1{background:radial-gradient(circle at 30% 40%,#ff8a3d 0,transparent 45%),radial-gradient(circle at 75% 70%,#a970ff 0,transparent 50%),linear-gradient(135deg,#1d1030,#0c1a2a)}
  .v2{background:radial-gradient(circle at 60% 35%,#3fb6ff 0,transparent 50%),linear-gradient(160deg,#0b2236,#12091f)}
  .v3{background:radial-gradient(circle at 35% 65%,#ff3d6e 0,transparent 48%),linear-gradient(200deg,#2a0d18,#0d0d1f)}
  .v4{background:radial-gradient(circle at 50% 45%,#53fc18 0,transparent 42%),linear-gradient(120deg,#0b1f10,#0c1418)}
  .live{position:absolute;left:10px;top:10px;padding:3px 7px;border-radius:5px;background:#e8283d;color:#fff;font-size:10px;font-weight:800;letter-spacing:.05em}
  .views{position:absolute;left:52px;top:10px;padding:3px 7px;border-radius:5px;background:rgba(0,0,0,.55);color:#fff;font-size:10px;font-weight:600}
  .play{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:rgba(0,0,0,.35);
        border:2px solid rgba(255,255,255,.75);backdrop-filter:blur(4px)}
  .play::after{content:"";position:absolute;left:21px;top:16px;border-left:16px solid #fff;border-top:10px solid transparent;border-bottom:10px solid transparent}
  .chat{flex:1;padding:9px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
  .msg{display:flex;gap:6px;align-items:center}
  .msg b{width:34px;height:7px;border-radius:4px;flex:none}
  .msg s{height:7px;border-radius:4px;background:#2a3236;text-decoration:none}
</style></head>
<body>
  <div class="intro">
    <div class="logo">
      <svg viewBox="0 0 64 64"><path class="stem" d="M33.2 15.5C33 11.5 34.2 8 36.6 4.8"/><path class="body" d="M36.2 9.6C40 4.2 47.5 3.2 52.5 5.4 49.6 10.8 42.4 12.8 36.2 9.6Z"/><path class="body" d="M32 14.2C25.6 14.2 23.4 19.4 23.4 24.6 23.4 29.6 20.4 31.6 17.2 35.6 13.2 40.6 12 46.8 14.2 52 17.2 58.8 24.4 62 32 62 39.6 62 46.8 58.8 49.8 52 52 46.8 50.8 40.6 46.8 35.6 43.6 31.6 40.6 29.6 40.6 24.6 40.6 19.4 38.4 14.2 32 14.2Z"/></svg>
    </div>
    <h1>Stream<br><span>Multiview</span></h1>
    <p class="tag">Watch several streams and their chats side by side, with layouts, live alerts and themes.</p>
    <div class="chips">
      <span class="chip"><i style="background:var(--kick)"></i>Kick</span>
      <span class="chip"><i style="background:var(--twitch)"></i>Twitch</span>
      <span class="chip"><i style="background:var(--yt)"></i>YouTube</span>
    </div>
  </div>

  <div class="app">
    <div class="bar">
      <span class="dots"><i></i><i></i><i></i></span>
      <span class="field"></span><span class="btn">Stream + chat</span><span class="btn add">Add</span>
      <span class="btn">★ Saved</span><span class="btn" style="margin-left:auto">Layout</span><span class="btn">Switch</span>
    </div>
    <div class="grid">
      <div class="win big"><div class="tb"><i style="background:var(--kick)"></i>Main stream<span class="vol"></span></div>
        <div class="video v1"><span class="live">LIVE</span><span class="views">12.4K</span><span class="play"></span></div></div>
      <div class="win"><div class="tb"><i style="background:var(--twitch)"></i>Second stream<span class="vol"></span></div>
        <div class="video v2"><span class="live">LIVE</span></div></div>
      <div class="win"><div class="tb"><i style="background:var(--yt)"></i>Third stream<span class="vol"></span></div>
        <div class="video v3"><span class="live">LIVE</span></div></div>
      <div class="win"><div class="tb"><i style="background:var(--kick)"></i>Chat</div><div class="chat" id="c1"></div></div>
      <div class="win"><div class="tb"><i style="background:var(--twitch)"></i>Chat</div><div class="chat" id="c2"></div></div>
    </div>
  </div>
<script>
  // abstract chat lines: a coloured name and a grey message, no real text
  const cols = ['#53fc18', '#a970ff', '#3fb6ff', '#ffbf2e', '#ff5fae', '#ff8a3d'];
  for (const id of ['c1', 'c2']) {
    const c = document.getElementById(id);
    for (let i = 0; i < 9; i++) {
      const m = document.createElement('div'); m.className = 'msg';
      m.innerHTML = `<b style="background:${cols[(i * 5 + id.length * 3 + (id === 'c2' ? 2 : 0)) % cols.length]}"></b><s style="width:${30 + ((i * 37 + (id === 'c2' ? 19 : 0)) % 55)}%"></s>`;
      c.appendChild(m);
    }
  }
</script>
</body></html>
