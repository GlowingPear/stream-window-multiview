# Release flow:
#   1. Changes land on main through pull requests (they never touch the version).
#   2. When you want an update, publish a GitHub release with a new tag like v0.2.11
#      (click "Generate release notes" to list the merged pull requests).
#   3. This workflow then:
#        - sets the version from the tag and adds the notes to CHANGELOG.md,
#          commits that to main and moves the tag onto that commit,
#        - builds the Windows (.exe) and Mac (.dmg) installers from it,
#        - attaches them to the release.
# Pull requests build the installers as a test (see the run's "Artifacts"), unless they only
# change things that can't affect the installers (docs, tests, text files).
name: Build installers

on:
  pull_request:
    paths-ignore:
      - '**.md'
      - '**.txt'
      - 'LICENSE'
      - '.gitignore'
      - 'test/**'
      - '.github/workflows/test.yml'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Check the release was made from the latest main
        run: |
          TAG_SHA=$(git rev-list -n 1 "${{ github.event.release.tag_name }}")
          MAIN_SHA=$(git rev-parse HEAD)
          if [ "$TAG_SHA" != "$MAIN_SHA" ]; then
            echo "::error::The release tag points at $TAG_SHA but main is at $MAIN_SHA. Create the release from the latest main."
            exit 1
          fi

      - name: Set the version and update CHANGELOG.md
        env:
          NOTES: ${{ github.event.release.body }}
        run: |
          printf '%s' "$NOTES" > "$RUNNER_TEMP/notes.md"
          node scripts/prepare-release.js "${{ github.event.release.tag_name }}" "$RUNNER_TEMP/notes.md"

      - name: Run the quick tests on the release
        run: npm test

      - name: Commit to main and move the tag
        id: commit
        run: |
          if git diff --quiet; then
            echo "Nothing to change."
          else
            git config user.name "${{ github.event.release.author.login }}"
            git config user.email "${{ github.event.release.author.id }}+${{ github.event.release.author.login }}@users.noreply.github.com"
            git commit -am "Release ${{ github.event.release.tag_name }}"
            git push origin HEAD:main
            git tag -f "${{ github.event.release.tag_name }}"
            git push -f origin "refs/tags/${{ github.event.release.tag_name }}"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    if: always() && (needs.prepare.result == 'success' || needs.prepare.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
            files: dist/*.exe
          - os: macos-latest
            target: --mac
            files: dist/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.sha || github.sha }}

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install the app engine
        run: npm install --no-audit --no-fund

      # Mac: sign with the project's own certificate (secrets MAC_CERT_P12 + MAC_CERT_PASSWORD) so every
      # version is recognised as the same app and macOS keeps letting it read its saved logins.
      - name: Set up the Mac signing certificate
        if: matrix.os == 'macos-latest'
        shell: bash
        env:
          P12: ${{ secrets.MAC_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          if [ -z "$P12" ]; then
            echo "::warning title=No Mac signing certificate::The MAC_CERT_P12 secret isn't set, so the Mac app is signed ad hoc and Mac users' logins won't survive updates."
            exit 0
          fi
          # if a command fails, say which one on the run's summary page
          trap 'echo "::error title=Mac certificate setup failed::line $LINENO: $BASH_COMMAND"' ERR
          KC="$RUNNER_TEMP/signing.keychain-db"; KC_PW=$(openssl rand -hex 16)
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KC_PW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PW" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -f pkcs12 -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KC_PW" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          NAME="Stream Multiview Code Signing"
          HASH=$(security find-certificate -c "$NAME" -Z "$KC" | awk '/SHA-1/{print $NF; exit}')
          [ -n "$HASH" ] || { echo "::error title=Mac certificate setup failed::the certificate isn't in the secret"; exit 1; }
          # it's self-signed, so tell this build machine to trust it for signing code (if that's refused, signing may still work)
          security find-certificate -c "$NAME" -p "$KC" > "$RUNNER_TEMP/cert.pem"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "$RUNNER_TEMP/cert.pem" \
            || echo "::warning title=Mac certificate::couldn't mark the certificate as trusted on the build machine"
          security find-identity -p codesigning "$KC"
          echo "MAC_SIGN_IDENTITY=$HASH" >> "$GITHUB_ENV"
          echo "MAC_SIGN_KEYCHAIN=$KC" >> "$GITHUB_ENV"

      - name: Build installer
        shell: bash
        run: |
          set -o pipefail
          npx --yes electron-builder@25.1.8 ${{ matrix.target }} --publish never 2>&1 | tee "$RUNNER_TEMP/build.log"
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      # Puts the end of the build log on the run's summary page if the build fails.
      - name: Show build errors
        if: failure()
        shell: bash
        run: |
          [ -f "$RUNNER_TEMP/build.log" ] || exit 0
          tail -n 40 "$RUNNER_TEMP/build.log" | sed -e 's/%/%25/g' -e 's/\r//g' | awk '{printf "%s%%0A", $0}' > tail.txt
          echo "::error title=Build log::$(cat tail.txt)"

      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  release:
    needs: [prepare, build]
    if: always() && github.event_name == 'release' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true

      - name: Notes for a release published without any
        run: node scripts/release-notes.js "${{ github.event.release.tag_name }}" > notes.md

      - if: github.event.release.body != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: installers/*

      - if: github.event.release.body == ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          body_path: notes.md
          files: installers/*
