# Runs the tests on every pull request and every change to main.
#   Quick tests: updates, release scripts and login encryption (Windows, Mac and Linux).
#   App tests:   the page in a headless browser, then the real desktop app on a virtual screen, recording
#                which code the tests run (coverage report on the run's summary page).
#   Dependencies: npm audit, for known holes in the packages the app installs (also every Monday).
# Run them yourself with: npm test   (and npm run test:setup once, then npm run test:all or npm run test:coverage)
name: Tests

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: npm audit
        run: |
          npm ci --no-fund --ignore-scripts
          npm audit --audit-level=moderate

  quick:
    if: github.event_name != 'schedule'
    name: Quick tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Quick tests
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee "$RUNNER_TEMP/quick.log" || {
            awk '/^not ok/{p=1;n=0} p{print; if(++n>25){p=0}}' "$RUNNER_TEMP/quick.log" | head -n 80 | sed -e 's/%/%25/g' -e 's/\r//g' | awk '{printf "%s%%0A", $0}' > fails.txt
            echo "::error title=Failed tests::$(cat fails.txt)"; exit 1; }

  # The page in a headless browser and the real desktop app on a virtual screen, recording which code the tests run.
  # Six parts side by side (UI tests in four, launch tests in two), each uploading what it recorded; then
  # "App tests" (the check main requires) runs the unit tests, joins the parts and writes the coverage report.
  app-part:
    if: github.event_name != 'schedule'
    name: App tests (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: UI 1 of 4, suite: ui, shard: 1/4 }
          - { name: UI 2 of 4, suite: ui, shard: 2/4 }
          - { name: UI 3 of 4, suite: ui, shard: 3/4 }
          - { name: UI 4 of 4, suite: ui, shard: 4/4 }
          - { name: launch 1 of 2, suite: launch, shard: 1/2 }
          - { name: launch 2 of 2, suite: launch, shard: 2/2 }
    runs-on: ubuntu-24.04            # (ubuntu-latest is 26.04 now, which Playwright 1.56 can't put its browser on)
    timeout-minutes: 20            # a part takes about 3 minutes; don't let a stuck one sit for 6 hours
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Install the app engine and the test browser
        run: |
          npm ci --no-audit --no-fund
          node node_modules/electron/install.js   # the engine now, not as the first test starts it (tests run side by side)
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Tests, with coverage
        shell: bash
        run: set -o pipefail; xvfb-run -a node scripts/coverage.js --suite ${{ matrix.suite }} --shard ${{ matrix.shard }} --no-report 2>&1 | tee "$RUNNER_TEMP/app.log"

      # What it recorded, for the report (also after a failed test: the report still says what ran)
      - name: Keep the coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.suite }}-${{ strategy.job-index }}
          path: coverage/raw
          retention-days: 3
          if-no-files-found: ignore

      # Puts the failing tests on the run's summary page.
      - name: Show failed tests
        if: failure()
        shell: bash
        run: |
          f="$RUNNER_TEMP/app.log"
          [ -f "$f" ] || exit 0
          awk '/^not ok/{p=1;n=0} p{print; if(++n>25){p=0}}' "$f" | head -n 80 | sed -e 's/%/%25/g' -e 's/\r//g' | awk '{printf "%s%%0A", $0}' > fails.txt
          [ -s fails.txt ] && echo "::error title=Failed tests (${{ matrix.name }})::$(cat fails.txt)"
          tail -n 40 "$f" | sed -e 's/%/%25/g' -e 's/\r//g' | awk '{printf "%s%%0A", $0}' > tail.txt
          echo "::error title=End of the log (${{ matrix.name }})::$(cat tail.txt)"

  app:
    if: ${{ !cancelled() && github.event_name != 'schedule' }}
    needs: app-part
    name: App tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - run: npm ci --no-audit --no-fund

      # The unit tests, recorded too (seconds), then each part's recording beside them
      - name: Unit tests, with coverage
        run: node scripts/coverage.js --suite unit --no-report
      - uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          path: coverage/raw/parts

      # The report goes on the run's summary page; it fails if a file drops below its minimum, or a part failed.
      - name: Coverage report
        run: node scripts/coverage.js --report
      - name: Every part passed
        if: ${{ needs.app-part.result != 'success' }}
        run: |
          echo "::error title=App tests::A part of the UI or launch tests failed: see its own job (App tests (…)) for which tests."
          exit 1
