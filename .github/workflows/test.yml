# Runs the tests on every pull request and every change to main.
#   Quick tests: updates, release scripts and login encryption (Windows, Mac and Linux).
#   App tests:   the page in a headless browser, then the real desktop app on a virtual screen.
# Run them yourself with: npm test   (and npm run test:setup once, then npm run test:all)
name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quick:
    name: Quick tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm test

  app:
    name: App tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install the app engine and the test browser
        run: |
          npm install --no-audit --no-fund
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: UI tests
        run: npm run test:ui

      - name: Launch test
        run: xvfb-run -a npm run test:launch
