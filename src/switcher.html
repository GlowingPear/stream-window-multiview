<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Only the app's own scripts run here: no script in the page itself, none from anywhere else (pictures and video
     from the sites, and the sites themselves in their web views, still load). -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' data: blob: https:; connect-src 'self' data: blob:; font-src 'self' data:; frame-src https:; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Stream Multiview – Switch control</title>
<link rel="icon" href="icon.png">
<!-- The main window's look arrives with the first update (so both always match): its CSS files go in
     before this, its <style> text in it. -->
<style id="appCss"></style>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#0a0c0d;color:#e9eef0;font:13px/1.3 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  body{display:block !important;padding:0 !important}
  #featSwitch.remote{display:grid !important;position:fixed !important;inset:0 !important;width:auto !important;height:auto !important;
    border:0 !important;border-radius:0 !important;box-shadow:none !important}
  #featSwitch.remote .fs-head{position:sticky;top:-6px;z-index:3;background:var(--panel);margin:-6px -8px 0;padding:6px 8px 4px}
  #minis{position:absolute;left:0;top:0;width:0;height:0;z-index:1}
  #minis .fs-miniwrap{position:absolute}
  .waiting{display:grid;place-items:center;height:100vh;color:#8a979c}
  body.fs-dragmode, body.fs-dragmode *{cursor:grabbing !important;user-select:none}
</style>
</head>
<body>
<script type="module" src="page/shared/dropdown.js"></script>
<div id="featSwitch" class="remote"><div class="fs-empty">Connecting to the main window…</div><div id="minis"></div></div>
<script src="page/layout/switcher-window.js"></script>
</body>
</html>
