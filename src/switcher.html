<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Stream Multiview – Switch control</title>
<link rel="icon" href="icon.png">
<!-- The main window's look arrives with the first update (so both always match): its CSS files go in
     before this, its <style> text in it. -->
<style id="appCss"></style>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#0a0c0d;color:#e9eef0;font:13px/1.3 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  body{display:block !important;padding:0 !important}
  #featSwitch.remote{display:grid !important;position:fixed !important;inset:0 !important;width:auto !important;height:auto !important;
    border:0 !important;border-radius:0 !important;box-shadow:none !important}
  #featSwitch.remote .fs-head{position:sticky;top:-6px;z-index:3;background:var(--panel);margin:-6px -8px 0;padding:6px 8px 4px}
  #minis{position:absolute;left:0;top:0;width:0;height:0;z-index:1}
  #minis .fs-miniwrap{position:absolute}
  .waiting{display:grid;place-items:center;height:100vh;color:#8a979c}
  body.fs-dragmode, body.fs-dragmode *{cursor:grabbing !important;user-select:none}
</style>
</head>
<body>
<script type="module" src="page/shared/dropdown.js"></script>
<div id="featSwitch" class="remote"><div class="fs-empty">Connecting to the main window…</div><div id="minis"></div></div>
<script>
'use strict';
const api = window.kmv;
const fsw = document.getElementById('featSwitch'), minisLayer = document.getElementById('minis');
let st = null, icon = {}, scripts = {}, structSig = '', pinned = true;
const minis = new Map();     // channel -> { wrap, wv, src, ready, sentPause }
const send = (type, extra) => api.switcherCmd(Object.assign({ type }, extra || {}));
const esc = t => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

api.onSwitcherPinned(on => { pinned = !!on; const b = fsw.querySelector('.fs-pin'); if (b) b.classList.toggle('on', pinned); });
api.onSwitcherState(s => {
  if (s.css) applyCss(s.css);
  if (s.icons) icon = s.icons;
  if (s.scripts) scripts = s.scripts;
  st = s;
  const sig = JSON.stringify([s.featOn, s.chatFocus, s.plainCols, s.items.map(i => [i.ch, i.label, i.plat, i.on, i.preview, i.mini])]);
  if (sig !== structSig){ structSig = sig; render(); } else update();
});

let cssFiles = '';
function applyCss(css){
  const at = document.getElementById('appCss'), files = css.files || [];
  if (files.join('\n') !== cssFiles){
    cssFiles = files.join('\n');
    document.querySelectorAll('link.app-css').forEach(l => l.remove());
    for (const href of files){ const l = document.createElement('link'); l.rel = 'stylesheet'; l.className = 'app-css'; l.href = href; at.before(l); }
  }
  if (at.textContent !== (css.text || '')) at.textContent = css.text || '';
}

let lastW = 0;
new ResizeObserver(() => { if (st && Math.abs(fsw.clientWidth - lastW) > 2){ render(); } else placeMinis(); }).observe(fsw);
fsw.addEventListener('scroll', () => { scrolledAt = performance.now(); }, { passive: true });
let scrolledAt = 0;

function render(){
  if (!st) return;
  lastW = fsw.clientWidth;
  const keep = fsw.scrollTop;
  [...fsw.children].forEach(c => { if (c !== minisLayer) c.remove(); });
  const head = document.createElement('div');
  head.className = 'fs-head';
  head.innerHTML = `<span class="fs-label">Switch control</span>` +
    (st.featOn ? '<label class="fs-side" title="How many stream + chat columns to show beside the big stream. More columns make the big stream smaller."><span>Side chats</span><select>' +
      [0, 1, 2, 3, 4, 5].map(n => `<option value="${n}">${n ? n : 'Auto'}</option>`).join('') + '</select></label>' : '') +
    (!st.featOn ? `<button class="fs-back fs-tofocus" title="Make one stream big, with its chat beside it">${icon.feat || ''}<span>Focus view</span></button>` : '') +
    (!st.plainCols ? `<button class="fs-back fs-tocols" title="Plain Columns (every stream above its chat)">${icon.colsview || ''}<span>Columns view</span></button>` : '') +
    (!st.chatFocus ? `<button class="fs-back fs-tocf" title="The Chat focus layout">${icon.chatview || ''}<span>Chat focus view</span></button>` : '') +
    (st.featOn ? `<button class="fs-back fs-pophid">${icon.popwin || ''}<span>Pop out hidden</span><em></em></button>` : '') +
    (st.featOn ? '<button class="fs-only"></button>' : '') +
    '<span class="fs-modes">' +
      `<button class="fs-mbtn fs-pin${pinned ? ' on' : ''}" title="Keep this window on top of other windows">${icon.pin || ''}</button>` +
      `<button class="fs-mbtn fs-mfloat" title="Put it back in the main window as a floating panel">${icon.float || ''}</button>` +
      `<button class="fs-mbtn fs-mdock" title="Put it back under the big stream in the main window (Focus view)">${icon.dock || ''}</button>` +
    '</span>';
  fsw.insertBefore(head, minisLayer);
  const on = (sel, f) => { const b = head.querySelector(sel); if (b) b.onclick = f; };
  on('.fs-tofocus', () => send('tofocus'));
  on('.fs-tocols', () => send('tocols'));
  on('.fs-tocf', () => send('tocf'));
  on('.fs-pophid', () => send('pophid'));
  on('.fs-only', () => send('focusonly'));
  on('.fs-mfloat', () => send('float'));
  on('.fs-mdock', () => send('dock'));
  on('.fs-pin', async () => { pinned = await api.switcherPin(!pinned); head.querySelector('.fs-pin').classList.toggle('on', pinned); });
  const sc = head.querySelector('.fs-side select');
  if (sc) sc.onchange = () => send('side', { n: +sc.value });

  // same card sizes as in the main window
  const inner = fsw.clientWidth - 16 - 10;
  const cols = Math.max(1, Math.floor((inner + 6) / (320 + 6)));
  const itemW = Math.max(120, Math.floor((inner - 6 * (cols - 1)) / cols));
  fsw.style.gridTemplateColumns = `repeat(${cols}, ${itemW}px)`;
  const thumbH = Math.round(itemW * 9 / 16);

  if (!st.items.length){
    const e = document.createElement('div'); e.className = 'fs-empty';
    e.textContent = 'No streams open in the main window.';
    fsw.insertBefore(e, minisLayer);
  }
  st.items.forEach(s => {
    if (s.cap){   // another app's window: pause (freeze picture), name, reconnect, close
      const it = document.createElement('div');
      it.className = 'fs-item cap' + (s.on ? ' on' : '');
      it.dataset.ch = s.ch;
      it.innerHTML = `<div class="fs-row"><button class="fs-play"></button>` +
        `<button class="fs-name" title="Make ${esc(s.label)} the big one"><i class="dot"></i><span>${esc(s.label)}</span><em class="fs-kind">window</em></button>` +
        `<button class="fs-rl" title="Reconnect to this window">${icon.reload}</button>` +
        `<button class="fs-x" title="Close this window">${icon.close}</button></div>`;
      it.querySelector('.fs-play').onclick = () => send('play', { ch: s.ch });
      it.querySelector('.fs-name').onclick = () => { if (!justDragged) send('focus', { ch: s.ch }); };
      it.querySelector('.fs-rl').onclick = e => { e.stopPropagation(); send('reload', { ch: s.ch }); };
      it.querySelector('.fs-x').onclick = e => { e.stopPropagation(); send('remove', { ch: s.ch }); };
      it.addEventListener('pointerdown', e => dragStart(e, it));
      fsw.insertBefore(it, minisLayer);
      return;
    }
    const it = document.createElement('div');
    it.className = 'fs-item plat-' + s.plat + (s.on ? ' on' : '') + (s.preview ? ' pv' : '');
    it.dataset.ch = s.ch;
    it.innerHTML =
      `<div class="fs-row"><button class="fs-play"></button>` +
      `<button class="fs-name" title="${s.on ? 'In focus. Click to put it back in its column' : 'Put ' + esc(s.label) + ' in the big spot'}"><i class="dot"></i><span>${esc(s.label)}</span></button>` +
      `<span class="fs-volw"><button class="fs-mute" title="Mute / unmute (Shift-click: hear only this one)"></button><input type="range" min="0" max="100" step="1" aria-label="Volume"><span class="fs-pct"></span></span>` +
      `<button class="fs-rl" title="Refresh ${esc(s.label)}">${icon.reload}</button>` +
      `<button class="fs-pv" title="${s.preview ? 'Hide' : 'Show'} small live preview">${s.preview ? icon.chevUp : icon.chevDown}</button>` +
      `<button class="fs-x" title="Remove ${esc(s.label)} (stream and chat)">${icon.close}</button></div>` +
      (s.preview ? `<div class="fs-thumb" style="height:${thumbH}px"><span class="fs-nopv">${s.mini ? 'Loading preview…' : 'Not live yet'}</span></div>` : '');
    it.querySelector('.fs-play').onclick = () => send('play', { ch: s.ch });
    it.querySelector('.fs-name').onclick = () => { if (!justDragged) send('focus', { ch: s.ch }); };
    it.querySelector('.fs-x').onclick = e => { e.stopPropagation(); send('remove', { ch: s.ch }); };
    it.querySelector('.fs-pv').onclick = () => send('preview', { ch: s.ch });
    it.querySelector('.fs-rl').onclick = e => {
      e.stopPropagation(); send('reload', { ch: s.ch });
      const b = e.currentTarget; b.classList.remove('spin'); void b.offsetWidth; b.classList.add('spin');
      const m = minis.get(s.ch); if (m && m.ready){ try { m.wv.loadURL(m.src).catch(() => {}); } catch {} }   // its address, not where its player moved to
    };
    it.querySelector('.fs-mute').onclick = e => send('mute', { ch: s.ch, solo: e.shiftKey });
    const slider = it.querySelector('input');
    slider.addEventListener('pointerdown', () => { it.dataset.adj = '1'; });
    slider.addEventListener('input', () => send('vol', { ch: s.ch, v: slider.value / 100, final: false }));
    slider.addEventListener('change', () => { delete it.dataset.adj; send('vol', { ch: s.ch, v: slider.value / 100, final: true }); });
    it.querySelector('.fs-volw').addEventListener('wheel', e => {
      if (performance.now() - scrolledAt < 450) return;
      e.preventDefault(); e.stopPropagation();
      const cur = (st.items.find(x => x.ch === s.ch) || s).vol;
      send('vol', { ch: s.ch, v: Math.min(1, Math.max(0, Math.round((cur + (e.deltaY < 0 ? 0.05 : -0.05)) * 100) / 100)), final: true });
    }, { passive: false });
    it.addEventListener('pointerdown', e => dragStart(e, it));
    fsw.insertBefore(it, minisLayer);
  });
  fsw.scrollTop = keep;
  update();
}

// Values that change often are updated in place (never rebuilt while you drag a slider).
function update(){
  if (!st) return;
  const head = fsw.querySelector('.fs-head');
  if (head){
    const sc = head.querySelector('.fs-side select'); if (sc && document.activeElement !== sc) sc.value = String(st.sideCols);
    const fo = head.querySelector('.fs-only');
    if (fo){
      fo.classList.toggle('on', st.focusOnly);
      fo.innerHTML = st.focusOnly ? `${icon.play}<span>Resume others</span>` : `${icon.pause}<span>Pause all except focus</span>`;
      fo.title = st.focusOnly ? 'Resume the streams this paused' : 'Pause every stream except the big one (and their previews) to save bandwidth';
    }
    const ph = head.querySelector('.fs-pophid');
    if (ph){
      ph.disabled = !st.hidden; ph.querySelector('em').textContent = st.hidden ? String(st.hidden) : '';
      ph.title = st.hidden ? `Move the ${st.hidden} stream${st.hidden > 1 ? 's' : ''} you can't see right now into the Streams window` : 'Every stream is already on screen';
    }
  }
  fsw.querySelectorAll('.fs-item').forEach(it => {
    const s = st.items.find(x => x.ch === it.dataset.ch); if (!s) return;
    if (s.cap){
      const pl = it.querySelector('.fs-play');
      pl.innerHTML = s.paused ? icon.play : icon.pause; pl.classList.toggle('paused', s.paused); it.classList.toggle('paused', s.paused);
      return;
    }
    const pct = Math.round(s.vol * 100), off = s.muted || pct === 0;
    const slider = it.querySelector('input');
    if (!it.dataset.adj) slider.value = pct;
    it.querySelector('.fs-pct').textContent = off ? 'off' : pct + '%';
    const mute = it.querySelector('.fs-mute');
    mute.innerHTML = off ? icon.volOff : icon.volOn;
    mute.classList.toggle('muted', off);
    it.classList.toggle('muted', off);
    const pl = it.querySelector('.fs-play');
    pl.innerHTML = s.paused ? icon.play : icon.pause;
    pl.title = !s.paused ? 'Pause' : s.why === 'you' ? 'Play (jumps back to live)'
      : s.why === 'focus' ? 'Paused by "Pause all except focus". Click to play it anyway' : 'Auto-paused while hidden. Click to play it anyway';
    pl.classList.toggle('paused', s.paused);
    it.classList.toggle('paused', s.paused);
    it.classList.toggle('autopaused', s.paused && s.why === 'auto');
  });
  placeMinis();
}

// Small live previews (always muted), kept alive across re-draws.
function placeMinis(){
  if (!st) return;
  const want = new Map(st.items.filter(s => s.preview && s.mini).map(s => [s.ch, s]));
  for (const [ch, m] of minis) if (!want.has(ch) || want.get(ch).mini !== m.src){ m.wrap.remove(); minis.delete(ch); }
  const base = fsw.getBoundingClientRect();
  want.forEach((s, ch) => {
    const it = [...fsw.querySelectorAll('.fs-item')].find(x => x.dataset.ch === ch);
    const th = it && it.querySelector('.fs-thumb'); if (!th) return;
    let m = minis.get(ch);
    if (!m){
      const wrap = document.createElement('div'); wrap.className = 'fs-miniwrap';
      const wv = document.createElement('webview');
      wv.setAttribute('partition', 'persist:kmv-mini');
      const cover = document.createElement('div'); cover.className = 'fs-cover';
      cover.title = `Put ${s.label} in the big spot`;
      cover.innerHTML = `<span class="fs-paused">${icon.pause}</span>`;
      cover.onclick = () => send('focus', { ch });
      cover.addEventListener('wheel', e => { e.preventDefault(); fsw.scrollTop += e.deltaY; }, { passive: false });
      wrap.append(wv, cover); minisLayer.appendChild(wrap);
      m = { wrap, wv, src: s.mini, ready: false, sentPause: null };
      minis.set(ch, m);
      wv.addEventListener('dom-ready', () => {
        m.ready = true;
        if (/youtube\.com/.test(s.mini) && scripts.ytcss){ try { wv.insertCSS(scripts.ytcss); } catch {} wv.executeJavaScript(scripts.ytfit).catch(() => {}); }
        m.sentPause = !!s.miniPaused;
        wv.executeJavaScript(`${scripts.vol};window.__kmv.set(0,true);${s.miniPaused ? 'window.__kmv.pause();' : ''}`).catch(() => {});
      });
      wv.src = s.mini;
    }
    const r = th.getBoundingClientRect();
    Object.assign(m.wrap.style, { left: (r.left - base.left + fsw.scrollLeft) + 'px', top: (r.top - base.top + fsw.scrollTop) + 'px', width: r.width + 'px', height: r.height + 'px' });
    m.wrap.classList.toggle('paused', !!s.miniPaused);
    if (m.ready && m.sentPause !== !!s.miniPaused){
      m.sentPause = !!s.miniPaused;
      m.wv.executeJavaScript(`window.__kmv && window.__kmv.${s.miniPaused ? 'pause' : 'play'}()`).catch(() => {});
    }
  });
}

// Drag a button onto another to swap the two streams.
let justDragged = false;
function dragStart(e, it){
  if (e.button !== 0 || e.target.closest('.fs-play, .fs-mute, .fs-pv, .fs-rl, .fs-x, input, .fs-volw')) return;
  const sx = e.clientX, sy = e.clientY, st0 = fsw.scrollTop;
  let dragging = false, target = null;
  const others = () => [...fsw.querySelectorAll('.fs-item')].filter(x => x !== it);
  const move = ev => {
    const dx = ev.clientX - sx, dy = ev.clientY - sy;
    if (!dragging){ if (Math.hypot(dx, dy) < 6) return; dragging = true; it.classList.add('fs-dragging'); document.body.classList.add('fs-dragmode'); }
    const fr = fsw.getBoundingClientRect();
    if (ev.clientY < fr.top + 28) fsw.scrollTop -= 12; else if (ev.clientY > fr.bottom - 28) fsw.scrollTop += 12;
    it.style.transform = `translate(${dx}px, ${dy + (fsw.scrollTop - st0)}px)`;
    const t = others().find(x => { const r = x.getBoundingClientRect(); return ev.clientX >= r.left && ev.clientX <= r.right && ev.clientY >= r.top && ev.clientY <= r.bottom; }) || null;
    if (t !== target){ target?.classList.remove('fs-drop'); target = t; target?.classList.add('fs-drop'); }
  };
  const up = () => {
    window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up); window.removeEventListener('pointercancel', up);
    if (!dragging) return;
    justDragged = true; setTimeout(() => { justDragged = false; }, 0);
    it.classList.remove('fs-dragging'); it.style.transform = ''; document.body.classList.remove('fs-dragmode');
    target?.classList.remove('fs-drop');
    if (target) send('swap', { ch: it.dataset.ch, to: target.dataset.ch });
  };
  window.addEventListener('pointermove', move); window.addEventListener('pointerup', up); window.addEventListener('pointercancel', up);
}
</script>
</body>
</html>
